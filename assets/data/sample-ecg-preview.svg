<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" fill="none">
  <rect width="880" height="540" rx="12" fill="#FFFFFF"/>
  <rect x="16" y="16" width="848" height="508" rx="10" fill="#F8FAFB" stroke="#D5E0E5" stroke-width="1.5"/>
  <!-- Header bar -->
  <rect x="16" y="16" width="848" height="68" rx="10" fill="#172B3A"/>
  <rect x="16" y="66" width="848" height="18" fill="#172B3A"/>
  <text x="42" y="50" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">CARDIOCARE — SAMPLE DEMONSTRATION DOCUMENT</text>
  <text x="42" y="70" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#A9C7CE">NOT A REAL CLINICAL ECG RECORD · FOR PORTAL INTERFACE DEMONSTRATION ONLY</text>

  <!-- Watermark -->
  <g transform="translate(440 295) rotate(-18)">
    <text x="0" y="0" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="44" font-weight="800" fill="#7B263A" fill-opacity="0.09">SAMPLE DEMO REPORT</text>
    <text x="0" y="34" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#168C91" fill-opacity="0.14">NO DIAGNOSTIC WAVEFORM OR CLINICAL INTERPRETATION</text>
  </g>

  <!-- Metadata Grid -->
  <rect x="42" y="106" width="796" height="96" rx="8" fill="#FFFFFF" stroke="#E2E8EC"/>
  <text x="62" y="134" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#5A6B78">REPORT TEMPLATE</text>
  <text x="62" y="156" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#172B3A">12-Lead ECG Visit Attachment (Sample Placeholder)</text>
  <text x="62" y="182" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#5A6B78">Demo Patient ID: CC-DEMO-2048  |  Status: Sample Preview Only</text>

  <text x="540" y="134" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#5A6B78">CLINICAL REVIEW NOTICE</text>
  <text x="540" y="156" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#7B263A">Requires Qualified Clinician Review</text>
  <text x="540" y="182" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#5A6B78">No automated reading is generated.</text>

  <!-- Neutral Grid Placeholder Box -->
  <rect x="42" y="222" width="796" height="190" rx="8" fill="#FFFFFF" stroke="#D5E0E5" stroke-dasharray="6 4"/>
  <line x1="42" y1="270" x2="838" y2="270" stroke="#EEF3F5"/>
  <line x1="42" y1="318" x2="838" y2="318" stroke="#EEF3F5"/>
  <line x1="42" y1="366" x2="838" y2="366" stroke="#EEF3F5"/>
  <text x="440" y="294" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#172B3A">Sample ECG Attachment Preview Area</text>
  <text x="440" y="324" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#4B5E6B">This preview intentionally omits fabricated ECG tracings and diagnostic values.</text>
  <text x="440" y="348" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#4B5E6B">In a live clinical portal, your verified PDF or diagnostic image from the clinic appears here.</text>

  <!-- Footer disclaimer -->
  <rect x="42" y="432" width="796" height="68" rx="8" fill="#F5E8EB" stroke="#E5C8D0"/>
  <text x="62" y="460" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#7B263A">Important Medical Notice:</text>
  <text x="62" y="482" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#3B242B">Actual ECG reports must be reviewed directly with a qualified cardiologist. If you experience chest pain or urgent symptoms, contact local emergency services.</text>
</svg>

